# Mỗi lần push thay đổi của app lên GitHub: build GlowBoard và tạo Release mới.
# App trên máy sẽ tự thấy Release mới, tải về và cập nhật.
name: Build & Release GlowBoard

on:
  push:
    branches: [ main, master, claude/admiring-clarke-u6q76m ]
    paths:
      - 'src/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        env:
          UPDATE_TOKEN: ${{ secrets.GLOWBOARD_UPDATE_TOKEN }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "::warning::Chưa có secret GLOWBOARD_UPDATE_TOKEN – bản này sẽ không tự cập nhật được."
          fi
          TOKEN_B64=$(printf '%s' "$UPDATE_TOKEN" | base64 -w0)
          dotnet build src/GlowBoard/GlowBoard.csproj -c Release \
            -p:Version="$VERSION" -p:UpdateToken="$TOKEN_B64"

      - name: Zip
        run: |
          cd src/GlowBoard/bin/Release/net48
          zip -r "$GITHUB_WORKSPACE/GlowBoard_Windows_x64.zip" \
            GlowBoard.exe GlowBoard.exe.config \
            Microsoft.Web.WebView2.Core.dll Microsoft.Web.WebView2.WinForms.dll WebView2Loader.dll

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" GlowBoard_Windows_x64.zip \
            --target "$GITHUB_SHA" \
            --title "GlowBoard v$VERSION" \
            --notes "$(git log -1 --pretty=%B)"
